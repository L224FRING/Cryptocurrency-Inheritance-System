[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# FROST signing + VDF evaluation live in the Rust crate under rust/.
# Foundry calls them via `ffi = true` in tests/scripts only; never on a live chain.
ffi = true
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./out" },
    { access = "read-write", path = "./rust/target" }
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
