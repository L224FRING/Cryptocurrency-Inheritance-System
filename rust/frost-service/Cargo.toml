[package]
name = "frost-service"
version = "0.2.0"
edition = "2021"
description = "Off-chain FROST (secp256k1) threshold signing service for the inheritance vault"

default-run = "frost-service"

[lib]
name = "frost_service"
path = "src/lib.rs"

[[bin]]
name = "frost-service"
path = "src/main.rs"

[[bin]]
name = "frost-relay"
path = "src/bin/relay.rs"

[dependencies]
frost-core = "3.0.0"
frost-secp256k1 = "3.0.0"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
ureq = { version = "3", default-features = false, features = ["json"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
