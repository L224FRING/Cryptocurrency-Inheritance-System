[package]
name = "frost-service"
version = "0.1.0"
edition = "2021"
description = "Off-chain FROST (secp256k1) threshold signing service for the inheritance vault"

[dependencies]
frost-core = "3.0.0"
frost-secp256k1 = "3.0.0"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
